
name: Web CI

on:
  pull_request:
    paths:
      - "client/**"
      - "server/**"
      - "docs/**"
      - ".github/workflows/ci.yml"

  push:
    branches:
      - main
      - "feat/**"
      - "chore/**"
    paths:
      - "client/**"
      - "server/**"
      - "docs/**"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

jobs:
  client-checks:
    name: Client lint, tests, and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run validation tests
        run: npm test

      - name: Build production client
        run: npm run build

  server-checks:
    name: Server lint, tests, and syntax check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install server dependencies
        run: npm install --no-audit --no-fund

      - name: Run ESLint
        run: npm run lint

      - name: Run Jest unit tests
        run: npm test

      - name: Check JavaScript syntax
        run: find src tests -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check
