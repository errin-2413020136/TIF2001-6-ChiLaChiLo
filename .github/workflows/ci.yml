name: Web CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "client/**"
      - "server/**"
      - "docs/**"
      - ".github/workflows/ci.yml"

  push:
    branches:
      - main
      - "feat/**"
      - "chore/**"
    paths:
      - "client/**"
      - "server/**"
      - "docs/**"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client-checks:
    name: Client lint, tests, and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run frontend unit tests
        run: npm test

      - name: Build production client
        run: npm run build

  server-checks:
    name: Server lint, tests, and syntax check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install server dependencies
        run: npm install --no-audit --no-fund

      - name: Run ESLint
        run: npm run lint

      - name: Run backend unit tests with coverage
        run: npm run test:coverage

      - name: Check JavaScript syntax
        run: find src tests -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check

      - name: Upload backend coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: server/coverage/
          if-no-files-found: warn
          retention-days: 7

  ci-required:
    name: CI Required
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - client-checks
      - server-checks
    if: always()
    steps:
      - name: Verify all required jobs
        env:
          CLIENT_RESULT: ${{ needs.client-checks.result }}
          SERVER_RESULT: ${{ needs.server-checks.result }}
        run: |
          echo "Client checks: ${CLIENT_RESULT}"
          echo "Server checks: ${SERVER_RESULT}"

          if [ "${CLIENT_RESULT}" != "success" ] || [ "${SERVER_RESULT}" != "success" ]; then
            echo "Required checks did not all succeed."
            exit 1
          fi

          echo "All required checks succeeded."
