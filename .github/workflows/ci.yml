name: Web CI

on:
  pull_request:
    paths:
      - "client/**"
      - "server/**"
      - "docs/**"
      - ".github/workflows/ci.yml"
  push:
    branches:
      - main
      - "feat/**"
      - "chore/**"
    paths:
      - "client/**"
      - "server/**"
      - "docs/**"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

jobs:
  client-checks:
    name: Client lint, tests, and build
    if: ${{ hashFiles('client/package.json') != '' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run validation tests
        run: npm test

      - name: Build production client
        run: npm run build

  server-syntax-check:
    name: Server JavaScript syntax check
    if: ${{ hashFiles('server/package.json') != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install server dependencies
        working-directory: server
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Check JavaScript syntax
        shell: bash
        run: |
          if [ -d server/src ]; then
            find server/src -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check
          else
            echo "server/src belum tersedia; tidak ada file JavaScript untuk diperiksa."
          fi
